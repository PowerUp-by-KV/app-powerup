name: CI

on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main, qa, dev]

jobs:
  quality:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Type check
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test -- --ci --coverage

  eas-build-android:
    name: EAS Build (Android preview APK)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android preview APK
        run: cd apps/mobile && eas build --platform android --profile preview --non-interactive --no-wait

      - name: Summary
        run: |
          echo "Android preview build queued on EAS." >> $GITHUB_STEP_SUMMARY
          echo "Track at https://expo.dev/accounts/deepakdev6055/projects/powerup/builds" >> $GITHUB_STEP_SUMMARY
          echo "You will get an email when the APK is ready." >> $GITHUB_STEP_SUMMARY
