name: CI

# The working branch here is `development`, but the triggers below only ever named `dev`.
# Feature work lands on `development` first, so every PR in that lane merged with no checks
# at all — CI only woke up once code had already reached qa. Name both.
on:
  push:
    branches: [main, qa, development, dev]
  pull_request:
    branches: [main, qa, development, dev]
  # Manual trigger: lets you queue an EAS Android build on demand from the
  # Actions tab without pushing/merging.
  workflow_dispatch:

jobs:
  quality:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Catch image files whose real content type doesn't match their extension
      # (e.g. a JPEG saved as .png). Android's AAPT rejects these, but only ~22 min
      # into an EAS build — this fails in seconds instead.
      - name: Validate image assets
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            type=$(file -b "$f")
            case "${f##*.}" in
              png) echo "$type" | grep -qi "PNG image data" || { echo "::error file=$f::Not a real PNG ($type)"; fail=1; } ;;
              jpg|jpeg) echo "$type" | grep -qi "JPEG image data" || { echo "::error file=$f::Not a real JPEG ($type)"; fail=1; } ;;
              gif) echo "$type" | grep -qi "GIF image data" || { echo "::error file=$f::Not a real GIF ($type)"; fail=1; } ;;
            esac
          done < <(find apps/mobile -type d -name node_modules -prune -o -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' \) -print0)
          if [ "$fail" -ne 0 ]; then
            echo "Image asset(s) have a content type that does not match their extension. Re-export or rename them."
            exit 1
          fi
          echo "All image assets match their extension."

      - name: Lint
        run: pnpm turbo run lint

      - name: Type check
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test -- --ci --coverage

      # Preflight: exercise the same Metro bundling path EAS runs.
      # Catches missing transitive deps (e.g. babel-preset-expo) in ~30s
      # instead of failing 20+ min into an EAS build.
      - name: Expo export (preflight bundle)
        run: cd apps/mobile && pnpm exec expo export --platform android --output-dir /tmp/expo-export-preflight

      # Same preflight for iOS. This only exercises the JS/Metro path — it will NOT
      # catch native compile breaks (see the ios-build job for that) — but it is fast
      # and catches iOS-only import/resolution problems.
      - name: Expo export (preflight bundle, iOS)
        run: cd apps/mobile && pnpm exec expo export --platform ios --output-dir /tmp/expo-export-preflight-ios

  # Compiles the native iOS project. This exists because CI only ever built Android,
  # so the iOS build broke (expo-av importing ExpoModulesCore/EXEventEmitter.h, removed
  # in SDK 55) and stayed broken unnoticed — nothing in the pipeline ever compiled it.
  # `pod install` succeeds on that failure, so only a real xcodebuild catches it.
  ios-build:
    name: iOS build (simulator)
    runs-on: macos-latest
    needs: quality
    # Gated like the Android EAS job rather than run per-commit: a macOS runner is
    # slow and metered, and the risk it guards against lands at merge time.
    # Build only when code actually lands on qa (or on manual dispatch). This also
    # ran on pull requests targeting qa, so every promotion spent two builds -- one
    # for the PR's merge ref that nobody installs, and one for the merge itself --
    # against a limited EAS quota (and macOS minutes for the iOS job).
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/qa') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild iOS project
        run: cd apps/mobile && CI=1 pnpm exec expo prebuild --platform ios

      - name: Build for simulator
        run: |
          cd apps/mobile/ios
          xcodebuild build \
            -workspace PowerUp.xcworkspace \
            -scheme PowerUp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

  eas-build-android:
    name: EAS Build (Android preview APK)
    runs-on: ubuntu-latest
    needs: quality
    # Run on push to qa (post-merge) AND on PRs targeting qa, so a dev→qa PR
    # produces a verifiable APK before it is merged.
    # Build only when code actually lands on qa (or on manual dispatch). This also
    # ran on pull requests targeting qa, so every promotion spent two builds -- one
    # for the PR's merge ref that nobody installs, and one for the merge itself --
    # against a limited EAS quota (and macOS minutes for the iOS job).
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/qa') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android preview APK
        run: cd apps/mobile && eas build --platform android --profile preview --non-interactive --no-wait

      - name: Summary
        run: |
          echo "Android preview build queued on EAS." >> $GITHUB_STEP_SUMMARY
          echo "Track at https://expo.dev/accounts/komalvardhanlolugu-team/projects/memora/builds" >> $GITHUB_STEP_SUMMARY
          echo "You will get an email when the APK is ready." >> $GITHUB_STEP_SUMMARY
